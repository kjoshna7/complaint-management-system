{% load static %}
<!DOCTYPE html>
<html>
<head>
<title>Submit Complaint</title>

<link rel="stylesheet" href="{% static 'complaints/style.css' %}">

<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet"/>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDatklB8NhQBBRkABXSh0QNklvvVNT5ZaM&libraries=places&callback=initMap" async defer></script>

<style>

body{
background:linear-gradient(135deg,#6a11cb,#2575fc);
font-family:"Segoe UI",sans-serif;
margin:0;
padding:0;
}

.container{
max-width:800px;
margin:60px auto;
background:#fff;
padding:30px 35px;
border-radius:16px;
box-shadow:0 15px 35px rgba(0,0,0,0.2);
}

h2{
text-align:center;
color:#2575fc;
margin-bottom:25px;
}

h3{
margin-top:20px;
color:#6a11cb;
border-bottom:2px solid #eee;
padding-bottom:5px;
}

label{
display:block;
margin-top:12px;
font-weight:600;
}

input,textarea,select{
width:100%;
padding:10px;
margin-top:6px;
border-radius:8px;
border:1px solid #ccc;
}

button{
width:100%;
margin-top:20px;
padding:12px;
border:none;
border-radius:10px;
background:linear-gradient(135deg,#2575fc,#6a11cb);
color:white;
font-size:16px;
cursor:pointer;
}

.location-search-button{
background:#198754;
margin-top:12px;
}

.info-text{
font-size:13px;
color:#666;
margin-top:5px;
}

#map{
height:400px;
margin-top:10px;
border-radius:10px;
}

#locationSearch{
width:100%;
box-sizing:border-box;
}

</style>
</head>

<body>

{% include 'complaints/navbar.html' %}

<div class="container">

<h2>Submit Complaint</h2>

<form method="post" enctype="multipart/form-data">
{% csrf_token %}

<input type="hidden" name="latitude" id="latitude">
<input type="hidden" name="longitude" id="longitude">

<label>Category</label>

<select name="category" id="category" required onchange="toggleOtherCategory()">
<option value="">Select Category</option>
<option value="Water">Water Supply</option>
<option value="Road">Road / Potholes</option>
<option value="Electricity">Electricity</option>
<option value="Garbage">Garbage / Waste</option>
<option value="Street Light">Street Light</option>
<option value="Drainage">Drainage</option>
<option value="Public Transport">Public Transport</option>
<option value="Other">Other</option>
</select>

<div id="otherCategoryDiv" style="display:none">
<label>Specify Category</label>
<input type="text" id="otherCategoryInput" name="other_category">
</div>

<label>Description</label>
<textarea name="description" required></textarea>

<h3>Location Details</h3>

<label>State</label>

<select name="state" id="stateDropdown" required>

<option value="">Search State</option>

<option>Andhra Pradesh</option>
<option>Arunachal Pradesh</option>
<option>Assam</option>
<option>Bihar</option>
<option>Chhattisgarh</option>
<option>Goa</option>
<option>Gujarat</option>
<option>Haryana</option>
<option>Himachal Pradesh</option>
<option>Jharkhand</option>
<option>Karnataka</option>
<option>Kerala</option>
<option>Madhya Pradesh</option>
<option>Maharashtra</option>
<option>Manipur</option>
<option>Meghalaya</option>
<option>Mizoram</option>
<option>Nagaland</option>
<option>Odisha</option>
<option>Punjab</option>
<option>Rajasthan</option>
<option>Sikkim</option>
<option>Tamil Nadu</option>
<option>Telangana</option>
<option>Tripura</option>
<option>Uttar Pradesh</option>
<option>Uttarakhand</option>
<option>West Bengal</option>

<option>Andaman and Nicobar Islands</option>
<option>Chandigarh</option>
<option>Dadra and Nagar Haveli and Daman and Diu</option>
<option>Delhi</option>
<option>Lakshadweep</option>
<option>Ladakh</option>
<option>Puducherry</option>
<option>Jammu and Kashmir</option>

</select>

<label>City</label>
<input type="text" name="city" id="city" required>

<label>Street / Area</label>
<textarea name="address" id="address" rows="3" required></textarea>

<label>Zipcode</label>
<input type="text" name="zipcode" id="zipcode" required>

<button type="button" class="location-search-button" onclick="moveMapToAddress(true)">
Search entered location
</button>

<label>Upload Image</label>
<input type="file" name="image">

<label>Priority</label>

<select name="priority" required>
<option value="Low">Low</option>
<option value="Medium">Medium</option>
<option value="High">High</option>
</select>

<h3>Select Complaint Location(optional)</h3>

<input type="text" id="locationSearch" placeholder="Search location">
<div id="map"></div>

<p class="info-text">
The map will move to the address you enter. Search for a landmark, drag the marker, or click the exact location.
</p>

<button type="submit">
Submit Complaint
</button>

</form>

</div>

<script>

$(document).ready(function(){

$('#stateDropdown').select2({
placeholder:"Search state"
});

});

function toggleOtherCategory(){

let category=document.getElementById("category").value;
let div=document.getElementById("otherCategoryDiv");

if(category==="Other")
div.style.display="block";
else
div.style.display="none";

}

let map;
let marker;
let geocoder;
let addressTimer;

function setComplaintLocation(location) {
	if (marker) {
		marker.setMap(null);
	}

	marker = new google.maps.Marker({
		position: location,
		map: map,
		draggable: true,
		title: "Complaint location"
	});

	document.getElementById("latitude").value = location.lat();
	document.getElementById("longitude").value = location.lng();

	marker.addListener("dragend", function(event) {
		document.getElementById("latitude").value = event.latLng.lat();
		document.getElementById("longitude").value = event.latLng.lng();
	});
}

function searchWithOpenStreetMap(queries, searchImmediately, lastStatus) {
	const tryQuery = function(index) {
		if (index >= queries.length) {
			if (searchImmediately) {
				alert("Location not found (" + lastStatus + "). Please check the address and try again.");
			}
			return;
		}

		const url = "https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=in&q=" + encodeURIComponent(queries[index]);
		fetch(url, {headers: {Accept: "application/json"}})
			.then(function(response) {
				if (!response.ok) throw new Error("OSM_" + response.status);
				return response.json();
			})
			.then(function(results) {
				if (!results.length) {
					tryQuery(index + 1);
					return;
				}

				const result = results[0];
				const location = new google.maps.LatLng(parseFloat(result.lat), parseFloat(result.lon));
				map.setCenter(location);
				map.setZoom(16);
				setComplaintLocation(location);
				document.getElementById("locationSearch").value = result.display_name;
			})
			.catch(function() {
				tryQuery(index + 1);
			});
	};

	tryQuery(0);
}

function moveMapToAddress(searchImmediately) {
	const state = document.getElementById("stateDropdown").value;
	const city = document.getElementById("city").value.trim();
	const address = document.getElementById("address").value.trim();
	const zipcode = document.getElementById("zipcode").value.trim();
	const locationSearch = document.getElementById("locationSearch").value.trim();
	const queries = [
		[address, city, state, zipcode, "India"],
		[address, city, state, "India"],
		[city, state, "India"]
	].map(function(parts) {
		return parts.filter(Boolean).join(", ");
	}).filter(Boolean);

	if (!state || !city || !address) {
		if (searchImmediately && locationSearch) {
			queries.unshift(locationSearch + ", India");
		} else if (searchImmediately) {
			alert("Please enter State, City and Address first.");
			return;
		} else {
			return;
		}
	}

	clearTimeout(addressTimer);
	const search = function() {
		const tryQuery = function(index, lastStatus) {
			if (index >= queries.length) {
				searchWithOpenStreetMap(queries, searchImmediately, lastStatus);
				return;
			}

			geocoder.geocode({address: queries[index], region: "IN"}, function(results, status) {
				if (status === "OK" && results[0]) {
					const location = results[0].geometry.location;
					map.setCenter(location);
					map.setZoom(16);
					setComplaintLocation(location);
					document.getElementById("locationSearch").value = results[0].formatted_address;
				} else {
					tryQuery(index + 1, status);
				}
			});
		};

		tryQuery(0, "ZERO_RESULTS");
	};

	addressTimer = setTimeout(search, searchImmediately ? 0 : 500);
}

function initMap() {
	const defaultLocation = {lat: 20.5937, lng: 78.9629};

	map = new google.maps.Map(document.getElementById("map"), {
		center: defaultLocation,
		zoom: 5,
		mapTypeControl: true,
		mapTypeControlOptions: {
			style: google.maps.MapTypeControlStyle.HORIZONTAL_BAR,
			position: google.maps.ControlPosition.TOP_LEFT
		},
		streetViewControl: true,
		fullscreenControl: true,
		zoomControl: true
	});

	geocoder = new google.maps.Geocoder();

	map.addListener("click", function(event) {
		setComplaintLocation(event.latLng);
	});

	document.getElementById("locationSearch").addEventListener("change", function() {
		const query = this.value.trim();
		if (!query) return;

		geocoder.geocode({address: query, region: "IN"}, function(results, status) {
			if (status === "OK" && results[0]) {
				map.setCenter(results[0].geometry.location);
				map.setZoom(16);
				setComplaintLocation(results[0].geometry.location);
			}
		});
	});

	const autocomplete = new google.maps.places.Autocomplete(
		document.getElementById("locationSearch"),
		{fields: ["geometry", "formatted_address", "name"], componentRestrictions: {country: "in"}}
	);

	autocomplete.addListener("place_changed", function() {
		const place = autocomplete.getPlace();
		if (!place.geometry || !place.geometry.location) return;

		map.setCenter(place.geometry.location);
		map.setZoom(18);
		setComplaintLocation(place.geometry.location);
	});

	["city", "address", "zipcode"].forEach(function(id) {
		document.getElementById(id).addEventListener("input", function() {
			moveMapToAddress(false);
		});
	});
	document.getElementById("stateDropdown").addEventListener("change", function() {
		moveMapToAddress(false);
	});
}

</script>

</body>
</html>
