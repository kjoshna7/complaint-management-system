<style>

.navbar{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:65px;
    background:linear-gradient(135deg,#1e3a8a,#ec4899);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 40px;
    box-shadow:0 8px 20px rgba(0,0,0,0.3);
    z-index:1000;
    font-family:"Segoe UI",sans-serif;
}

/* LEFT SIDE */

.nav-left{
    display:flex;
    align-items:center;
    gap:15px;
}

.home-icon{
    display:flex;
    align-items:center;
    gap:9px;
    text-decoration:none;
    color:white;
    transition:0.3s;
}

.brand-mark{
    display:flex;
    align-items:center;
    justify-content:center;
    width:34px;
    height:34px;
    background:#ff7a18;
    border-radius:10px;
    color:white;
    font-size:18px;
    font-weight:800;
}

.brand-name{
    font-size:18px;
    font-weight:800;
    letter-spacing:.2px;
}

.home-icon:hover{
    transform:translateY(-1px);
}

/* BACK BUTTON */

.back-btn{
    text-decoration:none;
    color:white;
    font-size:14px;
    font-weight:600;
    padding:6px 14px;
    border-radius:20px;
    background:rgba(255,255,255,0.2);
    transition:0.3s;
}

.back-btn:hover{
    background:rgba(255,255,255,0.35);
    transform:translateY(-2px);
}

/* RIGHT SIDE */

.nav-right{
    display:flex;
    align-items:center;
    gap:18px;
}

.nav-right a:hover{
    background:rgba(255,255,255,0.25);
    transform:translateY(-2px);
}

/* USER ICON */

.user-icon{
    font-size:20px;
}

/* BODY SPACING */

body{
    padding-top:75px;
}

<nav class="navbar">

<div class="nav-left">

<a href="{% url 'home' %}" class="home-icon" title="Home" aria-label="Home">
<span class="brand-mark">S</span>
<span class="brand-name">SpeakUp</span>
</a>

<a href="javascript:history.back()" class="back-btn">
⬅ Back
</a>

</div>


<div class="nav-right">

<a href="{% url 'dashboard' %}">
📊 Dashboard
</a>

<a href="{% url 'public_eye' %}">
👁 Public Eye
</a>

    <a href="{% url 'notifications' %}">
🔔 Notifications ({{ notification_count }})
</a>

<a href="{% url 'profile' %}">
👤 Profile
</a>

</div>

</nav>
